server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 16k;

  location /api/ {
    # Security headers on API responses come from the API itself (helmet).
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    # Replace, never append: the API trusts exactly one hop (this proxy) and reads this value.
    # Behind a load balancer, add the real_ip module here so $remote_addr is the visitor (DECISIONS.md).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_read_timeout 15s;
  }

  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
