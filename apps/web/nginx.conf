server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 16k;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  # Product images are loaded from the catalogue's own host, hence https: for images only.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    # Replace, never append: the API trusts exactly one hop (this proxy) and reads this value.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_read_timeout 15s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
