# Repeated in every location: nginx drops inherited add_header directives once a location sets its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# Product images are loaded from the catalogue's own host, hence https: for images only.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' https:; object-src 'none'; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
